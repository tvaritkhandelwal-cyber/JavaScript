<!doctype html>

<html>
    <head>
        <title>My Delivery Tracker</title>

        <style>
            body {
                font-family: Arial, sans-serif;

                background: aliceblue;

                text-align: center;

                padding: 30px;
            }

            h1 {
                color: #ff5a43;
            }

            button {
                background: #ff5a43;

                color: white;

                padding: 10px 25px;

                border: none;

                border-radius: 20px;

                cursor: pointer;

                margin: 5px;
            }

            div {
                border: 1px solid #ff5a43;

                width: 280px;

                margin: 6px auto;

                padding: 8px 12px;

                text-align: left;

                border-radius: 6px;
            }
        </style>
    </head>

    <body>
        <h1>My Delivery Tracker</h1>

        <button onclick="saveOrder()">Save Order</button>

        <button onclick="startDelivery()">Start Delivery</button>

        <div>JSON Text: <span id="json-text"></span></div>

        <div>Loaded Item: <span id="loaded-item"></span></div>

        <div>Loaded Price: <span id="loaded-price"></span></div>

        <div>Status: <span id="status"></span></div>

        <div>Result: <span id="result"></span></div>
    </body>
    <script>
        let order = {
            item: "Pizza",
            price: 300,
            shop: "My Snack Shop"
        }
        function saveOrder(){
            let jsonText = JSON.stringify(order)
            let loadedJSON = JSON.parse(jsonText)
            document.getElementById("json-text").textContent = jsonText
            document.getElementById("loaded-item").textContent = loadedJSON.item
            document.getElementById("loaded-price").textContent = "$"+loadedJSON.price
        }
        function delay(ms){
            return new Promise((resolve)=>{
                setTimeout(resolve,ms)
            })
        }
        async function startDelivery(){
            document.getElementById("result").textContent = ""
            document.getElementById("status").textContent = "Order Recieved"
            setTimeout(()=>{
                document.getElementById("status").textContent = "Kitchen is preparing..."
            },1000)
            await delay(3000)
            document.getElementById("status").textContent = "Out for delivery"
            await delay(2000)
            document.getElementById("result").textContent = "Your Order Has Arrived"
        }
    </script>
</html>
