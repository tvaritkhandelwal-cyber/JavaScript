<!doctype html>

<html>
    <head>
        <title>My Playlist Sorter</title>

        <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        />

        <style>
            body {
                background: lavender;
            }

            h1,
            h3 {
                color: darkviolet;
            }

            .box {
                background: white;
                color: darkviolet;
            }
        </style>
    </head>

    <body>
        <div class="container py-4">
            <h1 class="mb-1">My Playlist Sorter</h1>

            <p class="text-muted mb-4">
                Sort and label your music playlist using JavaScript array
                methods!
            </p>

            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Song Names</h3>

                    <button class="btn btn-primary mr-2" onclick="sortAZ()">
                        Sort A to Z
                    </button>

                    <button class="btn btn-primary" onclick="sortZA()">
                        Sort Z to A
                    </button>

                    <div id="nameResult" class="box p-3 mt-3 rounded"></div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Play Counts</h3>

                    <button class="btn btn-primary mr-2" onclick="sortLeast()">
                        Least Played First
                    </button>

                    <button class="btn btn-primary" onclick="sortMost()">
                        Most Played First
                    </button>

                    <div id="countResult" class="box p-3 mt-3 rounded"></div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Label Every Play Count</h3>

                    <button class="btn btn-primary" onclick="addLabel()">
                        Add Plays Label
                    </button>

                    <div id="labelResult" class="box p-3 mt-3 rounded"></div>
                </div>
            </div>
        </div>
    </body>
    <script>
        let songs = ["Zoom", " Bounce", " Glow", " Rush", " Spark"];
        let plays = [320, 85, 210, 50, 175];
        let name = document.getElementById("nameResult");
        let play = document.getElementById("countResult");
        let label = document.getElementById("labelResult");
        name.textContent = "Songs: " + songs;
        play.textContent = "Plays: " + plays;
        label.textContent = "Press The Above Button";
        function sortAZ() {
            songs.sort();
            name.textContent = "Sorted A-Z: " + songs;
        }
        function sortZA() {
            songs.sort();
            songs.reverse();
            name.textContent = "Sorted Z-A: " + songs;
        }
        function sortLeast() {
            plays.sort((a, b) => {
                return a - b;
            });
            play.textContent = "Sorted Least First: " + plays;
        }
        function sortMost() {
            plays.sort((a, b) => {
                return b - a;
            });
            play.textContent = "Sorted Most First: " + plays;
        }
        function addLabel() {
            let mapped = plays.map((c)=>{
                return " "+c + " plays";
            });
            label.textContent = mapped
        }
    </script>
</html>
