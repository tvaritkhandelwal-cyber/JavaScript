<!DOCTYPE html>
<head>
    <title>My Contact Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        h1{
            color:peru;
        }
        body{
            background-color: linen;
        }
    </style>
</head>
<body>
    <h1>My Phone Contacts</h1>
    <p class="text-muted mb-4">Printed via JavaScript</p>
    <div class="card shadow-sm mb-3" style="max-width: 400px;">
        <div class="card-body">
            <h5 class="card-title">Contact Details</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-tem">
                    <span class="card-label d-block">Name</span>
                    <strong id="name"></strong>
                </li>
                <li class="list-group-tem">
                    <span class="card-label d-block">Class</span>
                    <strong id="class"></strong>
                </li>
                <li class="list-group-tem">
                    <span class="card-label d-block">School</span>
                    <strong id="school"></strong>
                </li>
                <li class="list-group-tem">
                    <span class="card-label d-block">City</span>
                    <strong id="city"></strong>
                </li>
            </ul>
        </div>
    </div>
    <div class="card shadow-sm" style="max-width: 400px;">
        <div class="card-body">
            <h6 class="card-title">JavaScript Object Used</h6>
            <pre class="bg-light p-3 rounded border mb-0" id="code-display"></pre>
        </div>
    </div>
    <script>
        let me = {
            name:"Tvarit Khandelwal",
            class:8,
            school:"Amity International School",
            City:"Noida"
        }
        document.getElementById("name").innerHTML= me.name
        document.getElementById("class").innerHTML= me.class
        document.getElementById("school").innerHTML= me["school"]
        document.getElementById("city").innerHTML= me["City"]
        let code = document.getElementById("code-display")
        code.innerHTML = 
        `
        let me = {
            name: ${me.name},
            class: ${me.class},
            school:${me["school"]},
            City:${me["City"]}
        }
        `
    </script>
</body>
</html>
