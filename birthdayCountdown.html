<!DOCTYPE html>
<html>
<head>
  <title>My Birthday Countdown Checker</title>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(to right, #ffecd2, #fcb69f); text-align: center; }
    .card { width: 90%; max-width: 480px; background: white; border: 4px solid #ff6f91; border-radius: 20px; margin: 30px auto; padding: 20px; }
    h1 { color: #ff477e; }
    button { background: #ff477e; color: white; border: none; border-radius: 25px; padding: 12px 25px; font-size: 18px; cursor: pointer; }
    .box { background: #fff0f5; border: 2px dashed #ff6f91; border-radius: 12px; padding: 10px; margin-top: 12px; text-align: left; }
  </style>
</head>
<body>
  <div class="card">
    <h1>&#127874; My Birthday Countdown Checker</h1>
    <button onclick="checkCountdown()">Check Countdown</button>
    <div class="box"><h3>Missing Details</h3><p id="missing">(Part 1 fills this)</p></div>
    <div class="box"><h3>Greeting</h3><p id="greeting">(Part 2 fills this)</p></div>
    <div class="box"><h3>Days Left</h3><p id="message">(Part 3 fills this)</p></div>
    <div class="box"><h3>Countdown</h3><p id="countdown">(Part 4 fills this)</p></div>
  </div>
  <script>
    function checkCountdown() {
      let friendName = "Zara";  
      let daysLeft = 3;         

      let giftIdea = null;
      let cakeFlavour;
      document.getElementById("missing").textContent=giftIdea+cakeFlavour

      let hour = new Date().getHours(); 
      if(hour<12){
        document.getElementById("greeting").textContent = `Good Morning ${friendName}`
      }else if(hour<17){
        document.getElementById("greeting").textContent = `Good Afternoon ${friendName}`
      } else{
        document.getElementById("greeting").textContent = `Good Evening ${friendName}`
      }

      if(daysLeft === 0){
        document.getElementById("message").textContent = "Today is the party!"
      }else if(daysLeft === 1){
        document.getElementById("message").textContent = "Tomorrow is the party!"
      }else{
        document.getElementById("message").textContent = `${daysLeft} days to go until the party!`
      }

      // ---------- PART 4: the countdown ----------
      // YOUR CODE HERE
      // Use a while loop that starts at daysLeft and counts down to 1, adding a line
      // like "Days left: 3" each time (use <br> for a new line). Then add "Party time!".
      // Show it in the "countdown" box.
      let msg = ""
      while(daysLeft !== 0){
        msg += "Days Left: " + daysLeft + "<br>"
        daysLeft--
      }
      if(daysLeft === 0){
        msg += "Party Time!"
      }
      document.getElementById("countdown").innerHTML = msg
    }
  </script>
</body>
</html>
